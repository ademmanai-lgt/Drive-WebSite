<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DriveHub // IoT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="driveStyle.css">
</head>
<body>

<nav><div class="wrap">
  <div class="logo"><i>&gt;_</i><span>Adem-Manai<b>/DRIVE-IOT-1</b></span></div>
  <div class="status mono"><span class="dot load" id="dot"></span><span id="stat">connecting…</span></div>
</div></nav>

<header class="hero"><div class="wrap">
  <div class="term mono">root@IOT1DRIVE:~# ls -la /shared</div>
  <h1>Connect. Sense. <span class="g">Build.</span><br>Resources for IoT1 students.</h1>
  <p class="sub">Jaw L IoT1 Lkol Hne ( D3IWT 5IR BELEHI CHABEB L ADEM MANAI T-T )</p>
  <div class="tags"><span class="tag iot">#IoT</span></div>
  <div class="stats">
    <div class="stat"><b id="sFiles">0</b><span>files</span></div>
    <div class="stat"><b id="sFolders">0</b><span>folders</span></div>
    <div class="stat"><b id="sSize">0</b><span>total size</span></div>
    <div class="stat"><b id="sLast">—</b><span>last update</span></div>
  </div>
</div></header>

<main class="wrap">
  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" class="mono" placeholder="grep -i 'search files…'" autocomplete="off">
    </div>
    <select id="sort">
      <option value="name">Name</option>
      <option value="new">Newest</option>
      <option value="size">Size</option>
    </select>
    <div class="seg"><button id="vGrid" class="on">GRID</button><button id="vList">LIST</button></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="view"></div>
</main>

<footer>
  <div>© <span id="yr"></span> ADEM MANAI. All rights reserved.</div>
  <div style="margin-top:6px;opacity:.7">IOT1 DRIVE <span id="ivl"></span>s</div>
</footer>

<div class="modal" id="modal"><div class="mbox">
  <div class="mhead"><span id="mtitle"></span><div style="display:flex;gap:8px"><a class="btn p" id="mdl" target="_blank" rel="noopener" style="padding:6px 12px">Download</a><button class="btn" id="mclose" style="padding:6px 12px">Close ✕</button></div></div>
  <iframe id="mframe" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
</div></div>
<script src="drive(ADEM).js"></script>
</body>
</html>
